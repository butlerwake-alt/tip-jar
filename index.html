<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dump here</title>
<meta property="og:title" content="Dump here"/>
<meta property="og:url" content="https://butlerwake-alt.github.io/tip-jar/"/>
<style>
  body { margin:0; min-height:100vh; background:#0b1020; color:#e8eefc; font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; box-sizing:border-box; text-align:center; }
  h1 { margin:0; font-size:clamp(2.5rem,12vw,5rem); }
  img { width:min(85vw,420px); height:auto; background:#fff; padding:12px; border-radius:14px; box-sizing:border-box; image-rendering:pixelated; }
  code { font-size:.8rem; color:#9db0d8; word-break:break-all; max-width:420px; }
  button { background:#2a3a66; color:#e8eefc; border:0; border-radius:999px; padding:8px 16px; font:inherit; cursor:pointer; }
</style>
</head>
<body>
  <h1>Dump here</h1>
  <img src="btc_tip_qr.png" alt="Bitcoin QR for bc1qtxjpah5ntpq6fk92yukysc32zjewlz9q0sr4nv"/>
  <code id="a">bc1qtxjpah5ntpq6fk92yukysc32zjewlz9q0sr4nv</code>
  <button id="c">Copy address</button>
<script>
  document.getElementById('c').onclick = function () {
    var b = this, t = document.getElementById('a').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent='Copied!'; }, function(){ b.textContent='Select it manually'; });
    setTimeout(function(){ b.textContent='Copy address'; }, 2000);
  };
</script>
</body>
</html>
